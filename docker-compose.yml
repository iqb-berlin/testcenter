# Base compose file defining services and their settings
# For concrete images check the environment specific override files.

x-restart-policy: &restart-policy
  restart: "${RESTART_POLICY:-always}"

x-env-redis: &env-redis
  REDIS_HOST: cache-server
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_CACHE_FILES: ${REDIS_CACHE_FILES:-false}

x-env-db: &env-db
  DB_DATABASE: ${DB_DATABASE}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

# Where the backend keeps the files of the workspaces; without STORAGE_DRIVER=s3 the S3_* variables are not read
x-env-storage: &env-storage
  STORAGE_DRIVER: ${STORAGE_DRIVER:-filesystem}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-false}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_URL_RENEWAL_INTERVAL: ${S3_URL_RENEWAL_INTERVAL:-}

x-env-logging-conf: &env-logging-conf
  max-size: "200m"
  max-file: "10"

services:
  traefik:
    image: ${DOCKERHUB_PROXY}traefik:v3.6
    <<: *restart-policy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      testcenter:

  broadcaster:
    image: iqbberlin/testcenter-broadcaster:current
    <<: *restart-policy
    logging:
      options:
        <<: *env-logging-conf
    networks:
      testcenter:

  frontend:
    image: iqbberlin/testcenter-frontend:current
    <<: *restart-policy
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # allowed in the Content Security Policy: the address browsers load test files from in S3 mode, by default the
      # S3 API address for browsers (the backend falls back to S3_ENDPOINT the same way)
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN:-${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT:-}}}
    logging:
      options:
        <<: *env-logging-conf
    networks:
      testcenter:


  file-server:
    image: iqbberlin/testcenter-file-server:current
    <<: *restart-policy
    depends_on:
      - cache-server
    environment:
      <<: *env-redis
      # with s3 the file-server asks the backend for redirects to the bucket instead of reading the data volume
      STORAGE_DRIVER: ${STORAGE_DRIVER:-filesystem}
    volumes_from:
      - backend:ro
    networks:
      testcenter:

  backend:
    image: iqbberlin/testcenter-backend:current
    <<: *restart-policy
    depends_on:
      db:
        condition: service_healthy
      cache-server:
        condition: service_started
    environment:
      BROADCASTER_ENABLED: ${BROADCASTER_ENABLED}
      FILE_SERVER_ENABLED: ${FILE_SERVER_ENABLED}
      BRUTE_FORCE_PROTECTION: ${BRUTE_FORCE_PROTECTION:-}
      SERVER_KEY: ${SERVER_KEY}
      XML_SCHEMA_VALIDATION: ${XML_SCHEMA_VALIDATION:-}
      <<: [ *env-redis, *env-db, *env-storage ]
      DB_HOST: db
      DB_PORT: 5432
      PASSWORD_SALT: ${PASSWORD_SALT}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH}
      PASSWORD_PATTERN: ${PASSWORD_PATTERN}
      REQUIRE_LOGIN_PASSWORD: ${REQUIRE_LOGIN_PASSWORD:-false}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
    logging:
      options:
        <<: *env-logging-conf
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://backend:8080/version" ]
      start_period: 600s
      start_interval: 5s
      interval: 90s
      timeout: 30s
      retries: 3
    volumes:
      - backend_vol:/var/www/testcenter/data
      - /var/www/testcenter/data/.schemas
    networks:
      testcenter:

  cache-server:
    image: ${DOCKERHUB_PROXY}redis:8.0-bookworm
    <<: *restart-policy
    user: redis
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--maxmemory", "${REDIS_MEMORY_MAX:-1gb}",
      "--maxmemory-policy", "volatile-lru",
      "--save", '""',
      "--appendonly", "no"
    ]
    networks:
      testcenter:

  db:
    image: ${DOCKERHUB_PROXY}postgres:18.4
    <<: *restart-policy
    environment:
      # POSTGRES_* is the fixed interface of the official image. DB_* remains the only public configuration.
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_vol:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_DATABASE}", "-h", "127.0.0.1" ]
      start_period: 120s
      start_interval: 5s
      interval: 90s
      timeout: 30s
      retries: 3
    networks:
      testcenter:

volumes:
  postgres_vol:
  backend_vol:

networks:
  testcenter:
    name: ${COMPOSE_PROJECT_NAME}
    driver: bridge
