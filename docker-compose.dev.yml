# Compose file for local development and testing. Images are built from
# local directories which need to be cloned from the repository.

services:
  traefik:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${HOSTNAME}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=${FORCE_STS_HEADER:-true}"
      - "traefik.http.middlewares.security-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=no-referrer"
    command:
      - "--log.level=INFO"
      - "--accesslog=false"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
    networks:
      - testcenter

  broadcaster:
    build:
      dockerfile: broadcaster/Dockerfile
      target: dev
      args:
        REGISTRY_PATH: ${DOCKERHUB_PROXY}
    volumes:
      - ./common:/usr/src/testcenter/common
      - ./broadcaster/src:/usr/src/testcenter/broadcaster/src
    networks:
      - testcenter

  frontend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`www.${HOSTNAME}`) || Host(`${HOSTNAME}`)"
      - "traefik.http.routers.frontend.middlewares=security-headers, stripwww-fe"
      - "traefik.http.middlewares.stripwww-fe.redirectregex.regex=^http(s?)://www.${HOSTNAME}/(.*)"
      - "traefik.http.middlewares.stripwww-fe.redirectregex.replacement=http$${1}://${HOSTNAME}/$${2}"
    build:
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        REGISTRY_PATH: ${DOCKERHUB_PROXY}
    command: [
      "serve",
      "--configuration", "dev",
      "--host", "0.0.0.0",
      "--port", "8080"
    ]
    volumes:
      - ./common:/usr/src/testcenter/common
      - ./definitions:/usr/src/testcenter/definitions
      - ./frontend/src:/usr/src/testcenter/frontend/src
      - ./docs/dist:/usr/src/testcenter/docs/dist
    networks:
      - testcenter

  file-server:
    build:
      dockerfile: file-server/Dockerfile
      args:
        REGISTRY_PATH: ${DOCKERHUB_PROXY}
        ENABLED_MODULES: lua
    volumes:
      - ./sampledata/sample_resource_package.itcr.zip:/var/www/testcenter/data-TEST/ws_1/Resource/sample_resource_package.itcr.zip
      - ./sampledata/SAMPLE_UNITCONTENTS.HTM:/var/www/testcenter/data-TEST/ws_1/Resource/SAMPLE_UNITCONTENTS.HTM
      - ./sampledata/verona-player-simple-6.0.html:/var/www/testcenter/data-TEST/ws_1/Resource/verona-player-simple-6.0.html
      - ./sampledata/coding-scheme.vocs.json:/var/www/testcenter/data-TEST/ws_1/Resource/coding-scheme.vocs.json
      - ./sampledata/system-test/load-player/stars/CY-StarsUnit-001.vomd:/var/www/testcenter/data-TEST/ws_1/Resource/CY-StarsUnit-001.vomd
      - ./sampledata/system-test/load-player/stars/CY-StarsUnit-001.voud:/var/www/testcenter/data-TEST/ws_1/Resource/CY-StarsUnit-001.voud
      - ./sampledata/system-test/load-player/stars/iqb-player-stars-0.6.40.html:/var/www/testcenter/data-TEST/ws_1/Resource/iqb-player-stars-0.6.40.html
      - ./sampledata/system-test/load-player/speed/CY-SpeedUnit-001.voud:/var/www/testcenter/data-TEST/ws_1/Resource/CY-SpeedUnit-001.voud
      - ./sampledata/system-test/load-player/speed/CY-SpeedUnit-002.voud:/var/www/testcenter/data-TEST/ws_1/Resource/CY-SpeedUnit-002.voud
      - ./sampledata/system-test/load-player/speed/iqb-player-speedtest-9.9.99-cypress.html:/var/www/testcenter/data-TEST/ws_1/Resource/iqb-player-speedtest-9.9.99-cypress.html
      - ./file-server/nginx.conf:/etc/nginx/nginx.conf
      - ./file-server/auth/:/usr/share/nginx/auth
      - ./file-server/cors.conf:/etc/nginx/conf.d/cors.conf
    networks:
      - testcenter

  backend:
    build:
      dockerfile: backend/Dockerfile
      target: dev
      args:
        REGISTRY_PATH: ${DOCKERHUB_PROXY}
    volumes:
      - ./backend/.htaccess:/var/www/testcenter/backend/.htaccess
      - ./backend/config/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./backend/config/local.php.ini:/usr/local/etc/php/conf.d/local.ini
      - ./backend/config/no-cors.htaccess/:/var/www/testcenter/.htaccess
      - ./backend/config/vhost.conf:/etc/apache2/sites-available/vhost.conf
      - ./backend/check-db-compatibility.php:/var/www/testcenter/backend/check-db-compatibility.php
      - ./backend/index.php:/var/www/testcenter/backend/index.php
      - ./backend/initialize.php:/var/www/testcenter/backend/initialize.php
      - ./backend/routes.php:/var/www/testcenter/backend/routes.php
      - ./backend/src:/var/www/testcenter/backend/src
      - ./backend/test:/var/www/testcenter/backend/test
      - ./backend/mago.toml:/var/www/testcenter/backend/mago.toml:ro
      - ./definitions:/var/www/testcenter/definitions
      - ./docs/dist:/docs/dist
      - ./package.json:/var/www/testcenter/package.json
      - ./sampledata:/var/www/testcenter/sampledata
      - ./scripts/database:/var/www/testcenter/scripts/database
    environment:
      SKIP_READ_FILES: ${SKIP_READ_FILES:-no}
      SKIP_DB_INTEGRITY: ${SKIP_DB_INTEGRITY:-no}
      OVERWRITE_INSTALLATION: ${OVERWRITE_INSTALLATION:-no}
      NO_SAMPLE_DATA: ${NO_SAMPLE_DATA:-no}
    # Merged with the dependencies from docker-compose.yml. Only takes effect
    # while the `s3` profile is active; `make init-backend` writes the sample
    # workspace straight into the bucket and therefore cannot start before it.
    depends_on:
      seaweedfs:
        condition: service_healthy
        required: false
    ports:
      - "9005:9003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - testcenter

  cache-server:
    ports:
      - "6379:6379"

  # Port is forwarded to the host so a local IDE can connect to the database directly.
  db:
    ports:
      - "9092:5432"
    volumes:
      - ./scripts/database/000-create-test-db.sh:/docker-entrypoint-initdb.d/000-create-test-db.sh:ro
    networks:
      - testcenter

  # Local S3-compatible object storage for STORAGE_DRIVER=s3. Only started when
  # the `s3` profile is active; scripts/make/dev.mk derives that profile from
  # .env.dev's STORAGE_DRIVER (`make up`/`make init-backend`), so there is no
  # separate switch to flip. Invoking `docker compose` directly instead of
  # `make` needs `--profile s3` added by hand. The credentials and the bucket
  # are taken from the same S3_* variables the backend reads, so the store and
  # its client cannot drift apart. The bucket is created on startup; CORS
  # defaults to allowing every origin, which is what the presigned-URL
  # redirects need locally.
  seaweedfs:
    profiles:
      - s3
    image: ${DOCKERHUB_PROXY}chrislusf/seaweedfs:4.47
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "8333:8333"
      # SeaweedFS's own Admin UI: browse the bucket contents at
      # http://localhost:23646. No credentials set, so auth is disabled.
      - "23646:23646"
    volumes:
      - seaweedfs_vol:/data
    # The S3 API answers on /healthz about a second before the bucket is created,
    # so readiness has to include the bucket itself: the filer serves it under
    # /buckets/{name} and answers 404 as long as it is missing. Without that the
    # backend can start writing into a bucket that does not exist yet.
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -fsS -o /dev/null http://localhost:8333/healthz && curl -fsS -o /dev/null http://localhost:8888/buckets/${S3_BUCKET}/"
      ]
      start_period: 60s
      start_interval: 1s
      interval: 90s
      timeout: 10s
      retries: 3
    networks:
      - testcenter

volumes:
  seaweedfs_vol:
