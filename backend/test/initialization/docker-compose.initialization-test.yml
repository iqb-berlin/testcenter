# Compose-file for initialization-test
# Unfortunately we cannot inherit from the base compose file, because docker compose merges arrays such as volumes and networks
# a) it has to run in a different network
# b) we definitely don't want to include the anonymous volumes for data and db from dev here
# TODO move traefik-stuff from docker-compose.yml to separate file, so we can inherit from that instead of having a copy here

x-env-redis: &env-redis
  REDIS_HOST: cache-server
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_CACHE_FILES: ${REDIS_CACHE_FILES:-false}

# Keep one source of truth for the credentials exposed under two sets of names:
# the backend still reads its legacy MYSQL_* variables, while the PostgreSQL
# image requires POSTGRES_* variables during cluster initialization.
x-test-db-name: &test-db-name testcenter_db
x-test-db-user: &test-db-user testcenter_user
x-test-db-password: &test-db-password testcenter_pw

x-env-backend-database: &env-backend-database
  MYSQL_DATABASE: *test-db-name
  MYSQL_USER: *test-db-user
  MYSQL_PASSWORD: *test-db-password

x-env-postgres: &env-postgres
  POSTGRES_DB: *test-db-name
  POSTGRES_USER: *test-db-user
  POSTGRES_PASSWORD: *test-db-password

services:
  initialization-test-runner:
    image: iqbberlin/testcenter-task-runner
    profiles:
      - dredd_test_against_postgres
    build:
      context: ../../..
      dockerfile: task-runner/Dockerfile
      args:
        REGISTRY_PATH: ${DOCKERHUB_PROXY}
    command: "npm run backend:api-test"
    environment:
      TC_API_URL: http://initialization-test-backend
    volumes:
      - ../../../sampledata:/usr/src/testcenter/task-runner/sampledata
      - ../../../test:/usr/src/testcenter/task-runner/test
      - ../../../scripts:/usr/src/testcenter/task-runner/scripts
      - ../../../docs:/usr/src/testcenter/task-runner/docs
      - ../../../package.json:/usr/src/testcenter/task-runner/package.json
      - ../../../package-lock.json:/usr/src/testcenter/task-runner/package-lock.json
    depends_on:
      - initialization-test-db
      - initialization-test-backend
    networks:
      initialization-test:

  initialization-test-backend:
    image: iqbberlin/testcenter-backend:current
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
      target: dev
    entrypoint: [ "bash", "/var/www/testcenter/backend/test/initialization/entrypoint.sh" ]
    environment:
      # Pass the selection into the container explicitly. The previous inline
      # entrypoint happened to expand TEST_NAME while Compose parsed this file.
      TEST_NAME: ${TEST_NAME:-fallback}
      BROADCASTER_ENABLED: false
      FILE_SERVER_ENABLED: false
      <<: [ *env-redis, *env-backend-database ]
      MYSQL_HOST: initialization-test-db
      # SystemConfig still uses the legacy variable name, but PDO now connects to PostgreSQL.
      MYSQL_PORT: 5432
      PASSWORD_SALT: 't'
    volumes:
      - ../../../backend/.htaccess:/var/www/testcenter/backend/.htaccess
      - ../../../backend/index.php:/var/www/testcenter/backend/index.php
      - ../../../backend/initialize.php:/var/www/testcenter/backend/initialize.php
      - ../../../backend/routes.php:/var/www/testcenter/backend/routes.php
      - ../../../backend/src:/var/www/testcenter/backend/src
      - ../../../backend/test:/var/www/testcenter/backend/test
      - ../../../definitions:/var/www/testcenter/definitions
      - ../../../docs:/docs
      - ../../../package.json:/var/www/testcenter/package.original.json
      - ../../../sampledata:/var/www/testcenter/sampledata
      # The patch tests create short-lived SQL patches. Keep those writes in an
      # anonymous, --renew-anon-volumes-managed volume instead of mutating the
      # developer's bind-mounted checkout from a container running as www-data.
      - /var/www/testcenter/scripts/database
      # Mount the checkout read-only as the authoritative input. The test
      # entrypoint copies it into the writable volume before starting a case.
      - ../../../scripts/database:/var/www/testcenter/scripts/database-source:ro
    depends_on:
      initialization-test-db:
        condition: service_healthy
    networks:
      initialization-test:
    ports:
      - "85:80"

  initialization-test-db:
    image: ${DOCKERHUB_PROXY}postgres:18.4
    # The MySQL compatibility and TLS flags have no PostgreSQL equivalent.
    # Preserve only the increased connection limit used by this test service.
    command: [ "postgres", "-c", "max_connections=500" ]
    environment:
      <<: *env-postgres
    healthcheck:
      # Double dollar signs defer expansion to the container, where POSTGRES_* is available.
      test: [ "CMD-SHELL", "pg_isready --username \"$${POSTGRES_USER}\" --dbname \"$${POSTGRES_DB}\" --host 127.0.0.1" ]
      interval: 1s
      retries: 120
    ports:
      - "9091:5432"
    networks:
      initialization-test:

networks:
  initialization-test:
    name: testcenter-initialization-test
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_DAEMON_MTU:-1500}
