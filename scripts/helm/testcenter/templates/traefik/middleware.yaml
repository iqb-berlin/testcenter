{{- if .Values.ingress.traefikEnabled }}

# Common 'Security Headers'
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    #stsPreload: true
    #forceSTSHeader: true
    customFrameOptionsValue: SAMEORIGIN
    contentTypeNosniff: true
    #browserXssFilter: true
    referrerPolicy: no-referrer
---

# Common HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    port: "{{ .Values.ingress.httpsPort }}"
    permanent: true
---

# Broadcaster
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: stripregex-bs
spec:
  stripPrefix:
    prefixes:
      - "/bs/public"
---

# Frontend
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: stripregex-fe
spec:
  redirectRegex:
    regex: ^http(s?)://www\.(.*)
    replacement: http${1}://${2}
---

# File Server
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: stripregex-fs
spec:
  stripPrefix:
    prefixes:
      - "/fs"
---

# Backend
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: stripregex-be
spec:
  stripPrefix:
    prefixes:
      - "/api"
---

{{- end }}
