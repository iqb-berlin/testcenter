services:
  e2e:
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    image: testcenter-e2e
    build:
      dockerfile: e2e/Dockerfile
    # the browser runs in the Docker network and reaches the services by their names (see cypress.config.js)
    environment:
      E2E_FRONTEND_URL: http://frontend:8080
      E2E_BACKEND_URL: http://backend:8080
      E2E_FILE_SERVER_URL: http://file-server:8080
      E2E_BROADCASTER_URL: http://broadcaster:3000
      E2E_OUTPUT_FOLDER: cypress-headless
    command: [
      "npx", "cypress", "run",
      "--browser", "chrome",
      "--spec=${SPEC:-src/e2e/**/*}"
    ]
    volumes:
      - ./e2e/cypress-headless:/usr/src/testcenter/e2e/cypress-headless
      - ./e2e/src:/usr/src/testcenter/e2e/src
      - ./e2e/cypress.config.js:/usr/src/testcenter/e2e/cypress.config.js
      - ./e2e/tsconfig.json:/usr/src/testcenter/e2e/tsconfig.json
      - ./sampledata:/usr/src/testcenter/sampledata
    networks:
      - testcenter

  broadcaster:
    environment:
      DEV_MODE: false # loglevel

  frontend:
    command: "serve --configuration e2e --host 0.0.0.0 --port 8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://frontend:8080" ]
      start_period: 60s
      start_interval: 3s
      interval: 5m
      timeout: 30s
      retries: 3
