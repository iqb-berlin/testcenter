load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;

env REDIS_HOST;
env REDIS_PORT;
env REDIS_PASSWORD;
env REDIS_CACHE_FILES;
env STORAGE_DRIVER;

worker_processes auto; # The special value auto allows binding worker processes automatically to available CPUs
worker_cpu_affinity auto; # The optional mask parameter can be used to limit the CPUs available for automatic binding

pid /tmp/nginx.pid; # store pid in /tmp because rootless users cannot access the default folders like /var/run or /run

events {
  # assuming 1 core for each worker process, setting worker_connections to 1024 implies that Nginx can serve 1024 clients/second.
  worker_connections 1024;
}

http {
  # enable access to these paths in /tmp, as non-root cannot access default folders
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/null;
  error_log /dev/stdout;

  # Used by the 403 and 500 error pages below. Their response says only that something went wrong;
  # the cause is in the error_log. Both carry the same Error-ID, which leads from one to the other.
  # $file_path is what auth.lua resolved, e.g. /ws_1/Resource/UNIT.HTM. $request_uri would be the
  # obvious choice, but it still contains the group token - a credential, not something to log.
  log_format error_id '$error_id $status $file_path';

  tcp_nodelay on; # default = on. off can: help improve network efficiency and reduce congestion, but can introduce some latency
  keepalive_timeout 65;

  server_name_in_redirect off;

  charset utf-8;
  source_charset utf-8;
  include mime.types;
  gzip on;
  gzip_types # list from https://github.com/h5bp/server-configs-nginx/blob/main/h5bp/web_performance/compression.conf#L38
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/bmp
    image/svg+xml
    image/vnd.microsoft.icon
    image/x-icon
    text/cache-manifest
    text/calendar
    text/css
    text/javascript
    text/markdown
    text/plain
    text/xml
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

  resolver 127.0.0.11; # DNS resolver for the DNS cache; here hardcoded for docker setup. k8s uses another nginx config file

  lua_code_cache on;
  lua_shared_dict dns_cache 12k;
  lua_package_path "/usr/share/nginx/auth/?.lua;;";

  map $http_testmode $root {
    default /var/www/testcenter/data;
    integration /var/www/testcenter/data-TEST;
  }

  map $request_id $error_id {
    default fs-$request_id;
  }

  # S3 storage: the backend's redirects to files in the bucket (see location @s3_redirect). An entry is a
  # few hundred bytes; 10m of keys holds about 80,000 files.
  proxy_cache_path /tmp/file-server-cache keys_zone=s3_redirects:10m max_size=100m use_temp_path=off;

  server {
    server_tokens off; # removes the nginx version at least (removing the server-header at all is very difficult)
    listen 8080;
    listen [::]:8080;

    location / {
      root $root;
      include /etc/nginx/conf.d/cors.conf; # must be overriden in e2e/headless-context and in future maybe others too
      internal; # forbids direct access to the files without token
    }

    location /file {
      set $file_path '';
      access_by_lua_file auth/auth.lua;
      content_by_lua_file auth/content.lua;
    }

    # S3 storage (content.lua jumps here after auth.lua checked the group token): the backend answers
    # with a redirect to the file in the bucket, which stays the same until its `Expires`. Kept for
    # that long under the file path without the token, so all groups share it; one request per file
    # asks the backend at a time. 403/404 carry no `Expires` and pass through uncached.
    location @s3_redirect {
      # The address is in a variable, so nginx looks up `backend` only when a request comes here (via
      # `resolver` above). Written directly in `proxy_pass`, it is looked up at startup, and nginx
      # would not start without a backend container – even in filesystem mode, which never comes here.
      set $backend http://backend:8080;
      proxy_pass $backend$request_uri;
      proxy_redirect off;
      proxy_cache s3_redirects;
      # the backend redirects to the test storage when the testmode header asks for it
      proxy_cache_key $http_testmode$file_path;
      # the backend's `Cache-Control: private` is meant for shared caches between here and the
      # browser; it is still passed on
      proxy_ignore_headers Cache-Control;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # Public assets. Backend writes to data/public/uploaded_assets/ and returns
    # URLs prefixed with /public/uploaded_assets/. See AssetStorage::URL_PREFIX / ::getPath().
    # If you change either side, update the other.
    location /public/ {
      alias /var/www/testcenter/data/public/;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /health {
      access_log off;
      add_header 'Content-Type' 'text/plain';
      return 200 "healthy\n";
    }

    error_page 404 /404;
    error_page 403 /403;
    error_page 500 /500;

    location = /404 {
        internal;
        return 404 'File Server: File or Endpoint not found.';
    }

    location = /403 {
        internal;
        access_log /dev/stdout error_id;
        add_header Error-ID $error_id always;
        return 403 'File Server: Forbidden.';
    }

    location = /500 {
        internal;
        access_log /dev/stdout error_id;
        add_header Error-ID $error_id always;
        return 500 'File Server: Internal error.';
    }
  }
}
