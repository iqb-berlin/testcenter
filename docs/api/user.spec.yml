openapi: 3.0.0

info:
  title: ""
  version: "%%%VERSION%%%"

paths:
  /user/{user_id}/workspaces:
    get:
      summary: get a list of workspaces
      description: get a list of all workspaces belonging to a given user
      tags:
        - session management
      parameters:
        - in: header
          name: AuthToken
          description: auth-token for admin-user with super-admin privilege
          example: "a:user000000000.superadmin0"
          required: true
        - in: path
          name: user_id
          description: user-id
          example: 1
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: List of Workspaces
          content:
            application/json:
              schema:
                $ref: './components.spec.yml#/components/schemas/workspace_list'
              example:
                - id: '1'
                  name: "example_workspace"
                  selected: false
                  role: ''
        "401":
          description: Not authenticated
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "403":
          description: Forbidden
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "410":
          description: Session Expired
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "500":
          description: Server Error
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'

    patch:
      summary: change user roles
      description: changes user roles for a given user in several workspaces. *Provide user-name, not user-id!*
      tags:
        - super admin
      parameters:
        - in: header
          name: AuthToken
          description: auth-token for admin-user with super-admin privilege
          example: "a:user000000000.superadmin0"
          required: true
        - in: path
          name: user_id
          description: user-id
          example: 1
          required: true
          schema:
            type: integer

      requestBody:
        content:
          application/json:
            schema:
              properties:
                ws:
                  type: array
                  description: array of pairs role-id
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: workspace-id
                      role:
                        type: string # because dredd does not support enum
                        description: "role: 'RW', 'RO'"
              required:
                - ws
            example:
              ws:
                - role: RW
                  id: 1
      responses:
        "200":
          description: OK, roles have been updated
        "401":
          description: Not authenticated
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "403":
          description: Forbidden
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "410":
          description: Session Expired
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "500":
          description: Server Error
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'

  /user:
    put:
      summary: add a user
      description: adds a user
      tags:
        - super admin
      parameters:
        - in: header
          name: AuthToken
          description: auth-token for admin-user with super-admin privilege
          example: "a:user000000000.superadmin0"
          required: true
      requestBody:
        content:
          application/json:
            example:
              n: thirdUser
              p: thirdUsersPassword

      responses:
        "201":
          description: OK, user has been added
          content:
            text/html;charset=utf-8:
              example: "1"
        "400":
          description: |-
            Bad request. Either
             * the request body contains no name (n) or no password (p), or
             * the password violates the configured password rules. The rules in
               force can be read from `GET /system/config` (`passwordMinLength`,
               `passwordPattern`); the maximum length is 60 characters.
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "401":
          description: Not authenticated
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "403":
          description: Forbidden
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "409":
          description: A user of this name exists already. User names are unique.
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "410":
          description: Session Expired
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "500":
          description: Server Error
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'

  /user/{user_id}/password:
    patch:
      summary: change user-password
      description: changes the password of a given user. Can be called by super admin for all other admins or by the affected workspace admins themselves.
       * **if `user_id` is the performing user's own id (self-service change), `oldPassword` is required and is checked against the performing user's current password**
       * **if a super-admin resets another user's password, `oldPassword` is not required**
      tags:
        - super admin
        - workspace admin
      parameters:
        - in: header
          name: AuthToken
          description: auth-token for admin-user with super-admin privilege
          example: "a:user000000000.superadmin0"
          required: true
        - in: path
          name: user_id
          description: user-id
          example: 2
          required: true
          schema:
            type: integer

      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  type: string
                  description: "the new password"
                  example: secondUsersNewPassword
                oldPassword:
                  type: string
                  description: "the performing user's current password; required only for a self-service password change"
                  example: myCurrentPassword

      responses:
        "200":
          description: password has changed / user did not exist
        "400":
          description: |-
            Bad request. Either
             * the request body contains no password (p), or
             * the password violates the configured password rules. The rules in
               force can be read from `GET /system/config` (`passwordMinLength`,
               `passwordPattern`); the maximum length is 60 characters, or
             * the request is a self-service password change (`user_id` is the
               requesting user's own id) and the request body contains no
               `oldPassword`.
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "401":
          description: Not authenticated
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "403":
          description: |-
            Forbidden. Either the requesting user may not change this password,
            or the request is a self-service password change and `oldPassword`
            does not match the requesting user's current password.
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "410":
          description: Session Expired
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "500":
          description: Server Error
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'

  /user/{user_id}/super-admin/{new_status}:
    patch:
      summary: change super-admin status
      description: changes the super-admin status of a given user.
       * **requires a super-admin**
       * **requires the password of the performing user for security reasons**
       * `new_status` is `on` or `off`
      tags:
        - super admin
      parameters:
        - in: header
          name: AuthToken
          description: auth-token for admin-user with super-admin privilege
          example: "a:user000000000.superadmin0"
          required: true
        - in: path
          name: user_id
          description: user-id
          example: 2
          required: true
          schema:
            type: integer
        - in: path
          name: new_status
          description: super-user status of the given user `on` or `off`
          example: "on"
          required: true
          schema:
            type: string

      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p:
                  type: string
                  description: "performing user's password"
                  example: user123

      responses:
        "200":
          description: password has changed / user did not exist
        "400":
          description: Password missing
        "401":
          description: Not authenticated
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "403":
          description: |-
            Forbidden. Either the requesting user is no super-admin, or `p` does
            not match the requesting user's current password.
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "410":
          description: Session Expired
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
        "500":
          description: Server Error
          content:
            text/html:
              schema:
                $ref: './components.spec.yml#/components/schemas/error'
